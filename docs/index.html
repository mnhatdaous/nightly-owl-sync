<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OptiBot Sync Logs</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.25rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ddd; }
  th { color: #666; font-weight: 600; font-size: 0.85rem; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  #empty { color: #666; }
</style>
</head>
<body>
<h1>OptiBot daily sync — run history</h1>
<p id="empty">Loading...</p>
<table id="log-table" style="display:none">
  <thead><tr><th>Run (UTC)</th><th class="num">Added</th><th class="num">Updated</th><th class="num">Skipped</th></tr></thead>
  <tbody></tbody>
</table>
<script>
fetch('logs.json')
  .then(r => r.json())
  .then(entries => {
    const empty = document.getElementById('empty');
    if (!entries.length) { empty.textContent = 'No runs yet.'; return; }
    entries.reverse();
    const tbody = document.querySelector('#log-table tbody');
    for (const e of entries) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${e.datetime}</td><td class="num">${e.added}</td><td class="num">${e.updated}</td><td class="num">${e.skipped}</td>`;
      tbody.appendChild(tr);
    }
    empty.style.display = 'none';
    document.getElementById('log-table').style.display = '';
  })
  .catch(() => { document.getElementById('empty').textContent = 'Could not load logs.json.'; });
</script>
</body>
</html>
